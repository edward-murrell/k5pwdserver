<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[ .Title ]]</title>
    <!-- Vue.js CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        // Apply a saved theme before the page renders, to avoid a flash.
        try {
            const saved = localStorage.getItem('theme')
            if (saved) document.documentElement.dataset.theme = saved
        } catch (e) {}
    </script>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f5f5;
            --card: #ffffff;
            --text: #333333;
            --label: #555555;
            --muted: #888888;
            --border: #dddddd;
            --input-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
            --accent: #4CAF50;
            --accent-hover: #45a049;
            --disabled: #cccccc;
            --ok-bg: #dff0d8;
            --ok-text: #3c763d;
            --ok-border: #d6e9c6;
            --err-bg: #f2dede;
            --err-text: #a94442;
            --err-border: #ebccd1;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --bg: #121212;
                --card: #1e1e1e;
                --text: #e6e6e6;
                --label: #bbbbbb;
                --muted: #888888;
                --border: #444444;
                --input-bg: #2a2a2a;
                --shadow: rgba(0, 0, 0, 0.5);
                --accent: #43a047;
                --accent-hover: #4caf50;
                --disabled: #555555;
                --ok-bg: #1e3320;
                --ok-text: #a5d6a7;
                --ok-border: #2e5d32;
                --err-bg: #3b1e1e;
                --err-text: #ef9a9a;
                --err-border: #6d2b2b;
            }
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e6e6e6;
            --label: #bbbbbb;
            --muted: #888888;
            --border: #444444;
            --input-bg: #2a2a2a;
            --shadow: rgba(0, 0, 0, 0.5);
            --accent: #43a047;
            --accent-hover: #4caf50;
            --disabled: #555555;
            --ok-bg: #1e3320;
            --ok-text: #a5d6a7;
            --ok-border: #2e5d32;
            --err-bg: #3b1e1e;
            --err-text: #ef9a9a;
            --err-border: #6d2b2b;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
        }

        .password-change {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background-color: var(--card);
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--shadow);
        }

        h2 {
            color: var(--text);
            text-align: center;
            margin-bottom: 20px;
        }

        .password-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            color: var(--label);
            font-weight: bold;
        }

        .form-input {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            background-color: var(--input-bg);
            color: var(--text);
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .password-row {
            display: flex;
            gap: 6px;
        }

        .password-row .form-input {
            flex: 1;
            min-width: 0;
        }

        .toggle-btn {
            width: 56px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background-color: var(--input-bg);
            color: var(--label);
            font-size: 12px;
            cursor: pointer;
        }

        .toggle-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .submit-btn {
            padding: 10px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        .submit-btn:disabled {
            background-color: var(--disabled);
            cursor: not-allowed;
        }

        .message {
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
        }

        .success {
            background-color: var(--ok-bg);
            color: var(--ok-text);
            border: 1px solid var(--ok-border);
        }

        .error {
            background-color: var(--err-bg);
            color: var(--err-text);
            border: 1px solid var(--err-border);
        }

        .footer {
            position: fixed;
            right: 12px;
            bottom: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .theme-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background-color: var(--card);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button type="button" id="theme-toggle" class="theme-toggle" onclick="toggleTheme()"></button>
    <div id="app">
        <div class="password-change">
            <h2>[[ .Title ]]</h2>
            <form @submit.prevent="changePassword" class="password-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input 
                        type="text" 
                        id="username" 
                        v-model="username" 
                        required
                        class="form-input"
                        autocomplete="username"
                    >
                </div>
                <div class="form-group">
                    <label for="realm">Realm:</label>
                    <select
                            id="realm"
                            v-model="selectedRealm"
                            required
                            class="form-input"
                    >
                        <option value="">Select a realm</option>
                        <option v-for="realm in realms" :key="realm" :value="realm">
                            {{ realm }}
                        </option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="oldPassword">Current Password:</label>
                    <div class="password-row">
                        <input
                            :type="visible.oldPassword ? 'text' : 'password'"
                            id="oldPassword"
                            v-model="oldPassword"
                            required
                            class="form-input"
                            autocomplete="current-password"
                        >
                        <button
                            type="button"
                            class="toggle-btn"
                            :aria-pressed="visible.oldPassword"
                            aria-label="Show current password"
                            @click="visible.oldPassword = !visible.oldPassword"
                        >{{ visible.oldPassword ? 'Hide' : 'Show' }}</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password:</label>
                    <div class="password-row">
                        <input
                            :type="visible.newPassword ? 'text' : 'password'"
                            id="newPassword"
                            v-model="newPassword"
                            required
                            class="form-input"
                            autocomplete="new-password"
                        >
                        <button
                            type="button"
                            class="toggle-btn"
                            :aria-pressed="visible.newPassword"
                            aria-label="Show new password"
                            @click="visible.newPassword = !visible.newPassword"
                        >{{ visible.newPassword ? 'Hide' : 'Show' }}</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password:</label>
                    <div class="password-row">
                        <input
                            :type="visible.confirmPassword ? 'text' : 'password'"
                            id="confirmPassword"
                            v-model="confirmPassword"
                            required
                            class="form-input"
                            autocomplete="new-password"
                        >
                        <button
                            type="button"
                            class="toggle-btn"
                            :aria-pressed="visible.confirmPassword"
                            aria-label="Show new password confirmation"
                            @click="visible.confirmPassword = !visible.confirmPassword"
                        >{{ visible.confirmPassword ? 'Hide' : 'Show' }}</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" :disabled="!isValid">
                    Change Password
                </button>

                <div v-if="message" :class="['message', messageType]">
                    {{ message }}
                </div>
            </form>
        </div>
    </div>
    <footer class="footer">[[ .Package ]] [[ .Version ]]</footer>
    <script>
        function currentTheme() {
            return document.documentElement.dataset.theme ||
                (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        }

        function updateThemeToggle() {
            const next = currentTheme() === 'dark' ? 'light' : 'dark'
            document.getElementById('theme-toggle').textContent =
                next === 'dark' ? 'Dark mode' : 'Light mode'
        }

        function toggleTheme() {
            const next = currentTheme() === 'dark' ? 'light' : 'dark'
            document.documentElement.dataset.theme = next
            try {
                localStorage.setItem('theme', next)
            } catch (e) {}
            updateThemeToggle()
        }

        updateThemeToggle()
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeToggle)

        const { createApp } = Vue

        createApp({
            data() {
                return {
                    username: '',
                    oldPassword: '',
                    newPassword: '',
                    confirmPassword: '',
                    message: '',
                    messageType: '',
                    isLoading: false,
                    realms: [],
                    selectedRealm: '',
                    defaultRealm: '',
                    visible: {
                        oldPassword: false,
                        newPassword: false,
                        confirmPassword: false
                    }
                }
            },
            async created() {
                await this.loadRealms()
            },
            computed: {
                isValid() {
                    return this.username &&
                        this.oldPassword &&
                        this.newPassword &&
                        this.confirmPassword &&
                        this.selectedRealm &&
                        this.newPassword === this.confirmPassword &&
                        !this.isLoading
                }
            },
            methods: {
                async loadRealms() {
                    try {
                        const response = await fetch('/api/realms')
                        const data = await response.json()
                        this.realms = data.realms
                        this.defaultRealm = data.default_realm
                        this.selectedRealm = this.defaultRealm // Set default realm
                    } catch (error) {
                        this.message = 'Error loading realms'
                        this.messageType = 'error'
                        console.error('Error:', error)
                    }
                },
                async changePassword() {
                    if (!this.isValid) return

                    this.isLoading = true
                    this.message = ''

                    try {
                        const response = await fetch('/api/change-password', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                username: this.username,
                                oldPassword: this.oldPassword,
                                newPassword: this.newPassword,
                                realm: this.selectedRealm
                            })
                        })

                        const data = await response.json()

                        if (data.success) {
                            this.message = 'Password changed successfully!'
                            this.messageType = 'success'
                            this.resetForm()
                        } else {
                            this.message = data.message || 'Failed to change password'
                            this.messageType = 'error'
                        }
                    } catch (error) {
                        this.message = 'Error connecting to server'
                        this.messageType = 'error'
                        console.error('Error:', error)
                    } finally {
                        this.isLoading = false
                    }
                },
                resetForm() {
                    this.username = ''
                    this.oldPassword = ''
                    this.newPassword = ''
                    this.confirmPassword = ''
                    this.visible = { oldPassword: false, newPassword: false, confirmPassword: false }
                    this.selectedRealm = this.defaultRealm // Reset to default realm
                }
            }
        }).mount('#app')
    </script>


</body>
</html>
